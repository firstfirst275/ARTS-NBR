<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกรายรับ-รายจ่ายงาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10">
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow">
      <h1 class="text-lg font-bold">📝 บันทึกรายรับ-รายจ่าย</h1>
      <span class="text-xs bg-blue-700 px-2 py-1 rounded-full text-blue-100">Auto Sync</span>
    </header>

    <!-- Alert Toast -->
    <div id="statusToast" class="hidden mx-4 mt-3 p-3 rounded-lg text-sm text-center font-medium transition-all"></div>

    <!-- Form -->
    <form id="expenseForm" class="p-4 space-y-4 flex-1">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่ 📅</label>
        <input type="date" id="date" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">รายการ/งานที่ทำ 📝</label>
        <input type="text" id="title" placeholder="เช่น ค่าจ้างงาน A / ซื้ออุปกรณ์" required class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่ 🏷️</label>
        <select id="category" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="ทั่วไป">ทั่วไป</option>
          <option value="ค่าแรง/ค่าจ้าง">ค่าแรง/ค่าจ้าง</option>
          <option value="ค่าเดินทาง/น้ำมัน">ค่าเดินทาง/น้ำมัน</option>
          <option value="ค่าอุปกรณ์/สินค้า">ค่าอุปกรณ์/สินค้า</option>
          <option value="ค่าอาหาร/เครื่องดื่ม">ค่าอาหาร/เครื่องดื่ม</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">รายรับ (บาท) 💵</label>
          <input type="number" id="income" min="0" step="any" placeholder="0.00" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">รายจ่าย (บาท) 💸</label>
          <input type="number" id="expense" min="0" step="any" placeholder="0.00" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div class="space-y-2 pt-2 border-t">
        <label class="block text-xs font-semibold text-gray-600">หลักฐาน/สลิป 🖼️</label>
        <div>
          <input type="text" id="slipUrl" placeholder="ลิงก์รูปสลิป (คอลัมน์ G)" class="w-full border rounded-lg p-2 text-xs outline-none">
        </div>
        <div>
          <input type="text" id="proofUrl" placeholder="ลิงก์รูปสินค้า/หลักฐาน (คอลัมน์ H)" class="w-full border rounded-lg p-2 text-xs outline-none">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">
        บันทึกรายการ
      </button>
    </form>

    <!-- Recent History -->
    <div class="p-4 bg-gray-50 border-t">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">ประวัติการบันทึกล่าสุด</h2>
      <div id="historyList" class="space-y-2 text-sm max-h-48 overflow-y-auto">
        <p class="text-xs text-gray-400 text-center py-2">ยังไม่มีข้อมูลในเครื่องนี้</p>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzynJGldC0EFuqPpny9SKY6uaCY3V_DjdqlaCroU5H_nVC4KZwPKwVpiOQcg_FoZKfR/exec";

    // Set default date to today
    document.getElementById('date').valueAsDate = new Date();

    let localData = JSON.parse(localStorage.getItem('expense_data') || '[]');
    renderHistory();

    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const toast = document.getElementById('statusToast');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังบันทึกข้อมูล...';
      
      showToast('กำลังส่งข้อมูลลง Google Sheets...', 'bg-yellow-100 text-yellow-800');

      const incomeVal = parseFloat(document.getElementById('income').value) || 0;
      const expenseVal = parseFloat(document.getElementById('expense').value) || 0;
      
      // Calculate running balance
      const currentBalance = localData.reduce((acc, item) => acc + (item.income - item.expense), 0) + (incomeVal - expenseVal);

      const payload = {
        date: document.getElementById('date').value,
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        income: incomeVal,
        expense: expenseVal,
        balance: currentBalance,
        slipUrl: document.getElementById('slipUrl').value,
        proofUrl: document.getElementById('proofUrl').value
      };

      try {
        // Send to Apps Script Web App
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Save locally
        localData.unshift(payload);
        localStorage.setItem('expense_data', JSON.stringify(localData));
        renderHistory();

        showToast('บันทึกเรียบร้อย! ข้อมูลถูกส่งไป Google Sheets แล้ว 📊', 'bg-green-100 text-green-800');
        
        // Reset form
        document.getElementById('title').value = '';
        document.getElementById('income').value = '';
        document.getElementById('expense').value = '';
        document.getElementById('slipUrl').value = '';
        document.getElementById('proofUrl').value = '';

      } catch (error) {
        showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'bg-red-100 text-red-800');
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'บันทึกรายการ';
      }
    });

    function showToast(msg, classes) {
      const toast = document.getElementById('statusToast');
      toast.className = `mx-4 mt-3 p-3 rounded-lg text-sm text-center font-medium transition-all ${classes}`;
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (localData.length === 0) return;
      list.innerHTML = localData.slice(0, 5).map(item => `
        <div class="bg-white p-2.5 rounded shadow-sm flex justify-between items-center border">
          <div>
            <div class="font-medium text-gray-800">${item.title}</div>
            <div class="text-xs text-gray-400">${item.date} • ${item.category}</div>
          </div>
          <div class="text-right">
            ${item.income > 0 ? `<div class="text-green-600 font-semibold">+${item.income}</div>` : ''}
            ${item.expense > 0 ? `<div class="text-red-500 font-semibold">-${item.expense}</div>` : ''}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
